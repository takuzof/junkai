<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>巡回点検</title>
<meta name="theme-color" content="#f3f6f9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--navy:#18365b;--blue:#2f5f92;--bg:#f3f6f9;--card:#fff;--text:#1d2939;--muted:#667085;--line:#d8e0e8;--ok:#26734d;--warn:#a06a12;--bad:#a23b3b}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:92px}.top{background:linear-gradient(145deg,#fff,#eef4fa);padding:calc(18px + env(safe-area-inset-top)) 20px 20px;border-bottom:1px solid var(--line)}
.brand{font-size:13px;color:var(--blue);font-weight:800;letter-spacing:.08em}.top h1{font-size:27px;margin:6px 0 3px}.sub{color:var(--muted);font-size:14px}
main{padding:16px}.card{background:var(--card);border:1px solid #e3e8ef;border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 5px 18px rgba(30,55,85,.06)}
button,input,textarea{font:inherit} button{cursor:pointer}.primary{width:100%;border:0;border-radius:14px;padding:15px;background:var(--navy);color:#fff;font-weight:800;font-size:16px}
.secondary{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;color:var(--navy);font-weight:700}
label{display:block;font-size:13px;font-weight:700;margin:11px 0 6px;color:#475467}input,textarea{width:100%;border:1px solid #cfd8e3;border-radius:12px;padding:12px;background:#fff}textarea{min-height:82px;resize:vertical}
.row{display:flex;gap:9px}.row>*{flex:1}.hidden{display:none!important}.property{display:flex;justify-content:space-between;gap:12px;align-items:center}.property b{display:block}.property small{color:var(--muted)}
.pill{font-size:12px;background:#eaf1f8;color:var(--navy);padding:5px 8px;border-radius:999px;white-space:nowrap}
.progress{height:8px;background:#dfe6ee;border-radius:10px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:var(--blue);width:0}
.category-title{font-size:20px;font-weight:850;margin:0 0 4px}.category-desc{font-size:13px;color:var(--muted);margin-bottom:13px}
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.status button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 2px;font-weight:850}.status button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.item{padding:12px 0;border-top:1px solid #edf0f3}.item:first-of-type{border-top:0}.item-head{font-weight:750;margin-bottom:8px}.mini-status{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mini-status button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 2px;font-weight:800;font-size:13px}.mini-status button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:5}.footer .inner{max-width:532px;margin:auto;display:flex;gap:9px}.footer button{flex:1}
.notice{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}.badge{display:inline-block;padding:4px 8px;border-radius:9px;background:#eef3f8;color:var(--navy);font-size:12px;font-weight:800}
.summary-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0f3}.danger{color:var(--bad);font-weight:800}

.photo-tools{margin-top:9px}
.photo-add{width:100%;border:1px dashed #9fb0c3;background:#f7fafe;color:var(--navy);border-radius:11px;padding:10px;font-weight:800}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}
.photo-card{border:1px solid #dfe6ee;border-radius:12px;padding:7px;background:#fff;overflow:hidden}
.photo-card img{display:block;width:100%;height:105px;object-fit:cover;border-radius:8px;background:#eef2f6}
.photo-card textarea{min-height:48px;padding:8px;margin-top:6px;font-size:12px}
.photo-actions{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:11px;color:var(--muted)}
.photo-delete{border:0;background:#fff;color:var(--bad);font-weight:800;padding:4px}
.photo-count{font-size:11px;color:var(--muted);margin-top:5px}


.searchbox{margin-bottom:12px}.property-actions{display:flex;gap:6px;margin-top:8px}
.smallbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:750;color:var(--navy)}
.smallbtn.delete{color:var(--bad)}.prop-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.meta-chip{font-size:11px;padding:4px 7px;border-radius:8px;background:#f0f4f8;color:#526174}
.meta-chip.alert{background:#fff1f1;color:var(--bad)}.meta-chip.warn{background:#fff7e8;color:#8b5d0b}
.list-title{font-size:13px;font-weight:850;color:#667085;margin:4px 2px 9px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">PROPERTY INSPECTION · V1.4</div><h1 id="pageTitle">巡回点検</h1><div class="sub" id="pageSub">iPhone 現場点検 V1.4</div></header>
<main>
<section id="home">
 <div class="card"><h2 style="margin-top:0">定期巡回を開始</h2><p class="sub">登録済みの物件を選択して、現場で点検結果を記録します。</p><button class="primary" onclick="showProperties()">巡回点検を開始</button></div>
 <div class="card" id="draftCard"><div class="property"><div><b>保存中の巡回</b><small id="draftInfo">現在、作業中の巡回はありません</small></div><button class="smallbtn" id="resumeBtn" onclick="resumeDraft()" style="display:none">再開</button></div></div>
 <div class="card"><div class="property"><div><b>物件登録</b><small>登録は最初の1回だけ。次回から一覧から選べます。</small></div><span class="pill">繰り返し利用</span></div></div>
 <button class="secondary" onclick="showAddProperty()">＋ 物件を登録</button>
</section>

<section id="properties" class="hidden">
 <div class="card searchbox"><input id="propertySearch" placeholder="物件名・住所で検索" oninput="renderProperties(this.value)"></div>
 <div class="list-title">登録済み物件</div>
 <div id="propertyList"></div>
 <button class="secondary" onclick="showAddProperty()">＋ 新しい物件を登録</button>
 <p class="notice">物件登録は初回のみ。次回以降は一覧から選択できます。</p>
</section>

<section id="addProperty" class="hidden">
 <div class="card"><label>物件名</label><input id="propName" placeholder="例：サンライズマンション"><label>住所</label><input id="propAddress" placeholder="例：東京都品川区…"><label>管理メモ（任意）</label><textarea id="propMemo" placeholder="巡回時の注意事項など"></textarea></div>
 <button class="primary" onclick="saveProperty()">この物件を登録</button>
</section>

<section id="inspection" class="hidden">
 <div class="card"><div class="property"><div><b id="insProp"></b><small id="insDate"></small></div><span class="badge" id="catCounter"></span></div><div class="progress"><i id="progressBar"></i></div></div>
 <div id="categoryCard"></div>
</section>

<section id="summary" class="hidden">
 <div class="card"><h2 style="margin-top:0">巡回内容の確認</h2><div id="summaryBody"></div></div>
 <div class="card"><label>総合コメント</label><textarea id="overall" placeholder="今回の巡回についての総合コメント"></textarea></div>
 <button class="primary" id="pdfShareBtn" onclick="createAndSharePDF()">PDFを作成して会社へ送る</button>
 <button class="secondary" style="margin-top:9px" onclick="previewPDF()">PDFを作成して確認</button>
 <button class="secondary" style="margin-top:9px" onclick="discardCompleted()">送信・保存済みの巡回データを削除</button>
 <p class="notice">PDFはiPhone内で作成します。写真や点検データを外部サーバーへ送信しません。共有画面で「メール」等を選んで会社へ送信してください。</p>
</section>
</main>
<div class="footer hidden" id="footer"><div class="inner"><button class="secondary" onclick="prevCategory()">戻る</button><button class="primary" onclick="nextCategory()">次へ</button></div></div>

<input id="photoInput" type="file" accept="image/*" capture="environment" multiple class="hidden" onchange="handlePhotos(event)">

</div>
<script>
const CATEGORIES=[
 {name:"建物外周",desc:"建物周囲・外壁・敷地境界など",items:["外壁・ひび割れ・破損","建物周囲の清掃状況","放置物・不法投棄","雨樋・排水まわり"]},
 {name:"エントランス",desc:"入口・オートロック・集合ポストなど",items:["入口扉・オートロック","集合ポスト","掲示板・掲示物","床・壁・清掃状況"]},
 {name:"共用廊下・階段",desc:"各階の廊下・階段・手すりなど",items:["廊下・階段の清掃","手すり・床・壁の破損","私物・放置物","共用灯"]},
 {name:"ゴミ置場",desc:"ごみ集積所の状態・分別状況",items:["分別状況","収集日以外のごみ","粗大ごみ・不法投棄","清掃・臭気"]},
 {name:"駐輪場・駐車場",desc:"車両・自転車・区画の状態",items:["放置自転車・車両","区画・通路","整理整頓","設備・照明"]},
 {name:"植栽・外構",desc:"植栽・フェンス・敷地設備",items:["植栽の伸び・枯れ","雑草","フェンス・塀","外構の破損"]},
 {name:"消防・設備",desc:"消防設備・共用設備の目視確認",items:["消火器","誘導灯・非常灯","設備扉・メーターボックス","その他共用設備"]},
 {name:"その他",desc:"屋上・配管・設備・気付いた事項",items:["漏水・水濡れ","異臭・異音","害虫・害獣の形跡","その他"]}
];
const STATUS=["○","△","×","－"];
let current=0, draft=null, editingPropertyId=null;
function sections(id){["home","properties","addProperty","inspection","summary"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));document.getElementById("footer").classList.toggle("hidden",id!=="inspection")}
function title(t,s=""){document.getElementById("pageTitle").textContent=t;document.getElementById("pageSub").textContent=s}
function props(){return JSON.parse(localStorage.getItem("inspection_properties")||"[]")}
function showProperties(){sections("properties");title("物件を選択","巡回する物件を選んでください");renderProperties()}
function showAddProperty(id=null){
 editingPropertyId=id;sections("addProperty");
 if(id){let p=props().find(x=>x.id===id);title("物件を編集","登録済み情報を変更");propName.value=p?.name||"";propAddress.value=p?.address||"";propMemo.value=p?.memo||"";}
 else{title("物件登録","登録は最初の一度だけ");propName.value=propAddress.value=propMemo.value="";}
}
function saveProperty(){
 let n=propName.value.trim();if(!n)return alert("物件名を入力してください");
 let p=props();
 if(editingPropertyId){let i=p.findIndex(x=>x.id===editingPropertyId);if(i>=0)p[i]={...p[i],name:n,address:propAddress.value.trim(),memo:propMemo.value.trim()};}
 else p.push({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),name:n,address:propAddress.value.trim(),memo:propMemo.value.trim()});
 localStorage.setItem("inspection_properties",JSON.stringify(p));editingPropertyId=null;showProperties();
}
function getHistoryForProperty(id){return JSON.parse(localStorage.getItem("inspection_history")||"[]").filter(h=>h.property&&h.property.id===id)}
function previousStats(id){
 let h=getHistoryForProperty(id);if(!h.length)return {date:"未巡回",bad:0,warn:0};
 let last=h[0],bad=0,warn=0;(last.categories||[]).forEach(c=>(c.items||[]).forEach(i=>{if(i.status==="×")bad++;if(i.status==="△")warn++;}));
 return {date:last.date||"記録あり",bad,warn};
}
function renderProperties(q=""){
 let p=props(),el=document.getElementById("propertyList");q=(q||"").trim().toLowerCase();
 if(q)p=p.filter(x=>(x.name+" "+(x.address||"")).toLowerCase().includes(q));
 if(!p.length){el.innerHTML='<div class="card sub">該当する物件がありません。</div>';return}
 el.innerHTML=p.map(x=>{let st=previousStats(x.id);return `<div class="card"><div class="property" onclick="startInspection('${x.id}')"><div><b>${esc(x.name)}</b><small>${esc(x.address||"住所未登録")}</small><div class="prop-meta"><span class="meta-chip">前回：${esc(st.date)}</span>${st.bad?`<span class="meta-chip alert">× ${st.bad}件</span>`:""}${st.warn?`<span class="meta-chip warn">△ ${st.warn}件</span>`:""}</div></div><span class="pill">巡回開始 ›</span></div><div class="property-actions"><button class="smallbtn" onclick="event.stopPropagation();showAddProperty('${x.id}')">編集</button><button class="smallbtn delete" onclick="event.stopPropagation();deleteProperty('${x.id}')">削除</button></div></div>`}).join("");
}
function deleteProperty(id){
 let p=props().find(x=>x.id===id);if(!p)return;
 if(!confirm(`「${p.name}」を物件一覧から削除しますか？\n過去の巡回履歴は削除しません。`))return;
 localStorage.setItem("inspection_properties",JSON.stringify(props().filter(x=>x.id!==id)));renderProperties(document.getElementById("propertySearch")?.value||"");
}
function startInspection(id){let p=props().find(x=>x.id===id);draft={id:Date.now().toString(),property:p,date:new Date().toLocaleDateString("ja-JP"),categories:CATEGORIES.map(c=>({name:c.name,comment:"",items:c.items.map(i=>({name:i,status:"",photos:[]}))})),overall:""};current=0;saveDraft();sections("inspection");renderCategory()}
function renderCategory(){let c=CATEGORIES[current],d=draft.categories[current];title("巡回点検",draft.property.name);insProp.textContent=draft.property.name;insDate.textContent=draft.date;catCounter.textContent=`${current+1} / ${CATEGORIES.length}`;progressBar.style.width=((current+1)/CATEGORIES.length*100)+"%";categoryCard.innerHTML=`<div class="card"><div class="category-title">${c.name}</div><div class="category-desc">${c.desc}</div>${c.items.map((it,i)=>`<div class="item"><div class="item-head">${it}</div><div class="mini-status">${STATUS.map(s=>`<button class="${d.items[i].status===s?"active":""}" onclick="setStatus(${i},'${s}')">${s}</button>`).join("")}</div><div class="photo-tools"><button class="photo-add" onclick="choosePhotos(${i})">📷 写真を追加</button>${renderPhotos(i)}</div></div>`).join("")}<label>このカテゴリーのコメント</label><textarea id="catComment" placeholder="気付いた点・対応が必要な内容など" oninput="setComment(this.value)">${esc(d.comment)}</textarea></div>`}

let photoTargetItem=null;
function choosePhotos(i){
 photoTargetItem=i;
 let input=document.getElementById("photoInput");
 input.value="";
 input.click();
}
async function handlePhotos(e){
 let files=[...e.target.files];
 if(photoTargetItem===null||!files.length)return;
 let item=draft.categories[current].items[photoTargetItem];
 if(!item.photos)item.photos=[];
 for(const file of files){
   try{
     let data=await compressImage(file,1280,.76);
     item.photos.push({id:(crypto.randomUUID?crypto.randomUUID():Date.now().toString()+Math.random()),data:data,comment:""});
   }catch(err){alert("写真を読み込めませんでした。");}
 }
 saveDraft();
 renderCategory();
 photoTargetItem=null;
}
function compressImage(file,maxSide,quality){
 return new Promise((resolve,reject)=>{
   let reader=new FileReader();
   reader.onerror=reject;
   reader.onload=()=>{
     let img=new Image();
     img.onerror=reject;
     img.onload=()=>{
       let w=img.width,h=img.height,scale=Math.min(1,maxSide/Math.max(w,h));
       let cw=Math.round(w*scale),ch=Math.round(h*scale);
       let canvas=document.createElement("canvas");canvas.width=cw;canvas.height=ch;
       let ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,cw,ch);
       resolve(canvas.toDataURL("image/jpeg",quality));
     };
     img.src=reader.result;
   };
   reader.readAsDataURL(file);
 });
}
function renderPhotos(i){
 let photos=draft.categories[current].items[i].photos||[];
 if(!photos.length)return `<div class="photo-count">写真なし</div>`;
 return `<div class="photo-count">${photos.length}枚</div><div class="photo-grid">${photos.map((p,j)=>`<div class="photo-card"><img src="${p.data}" alt="点検写真"><textarea placeholder="写真コメント" oninput="photoComment(${i},${j},this.value)">${esc(p.comment||"")}</textarea><div class="photo-actions"><span>写真 ${j+1}</span><button class="photo-delete" onclick="deletePhoto(${i},${j})">削除</button></div></div>`).join("")}</div>`;
}
function photoComment(i,j,v){
 let p=draft.categories[current].items[i].photos[j];
 p.comment=v;
 saveDraft();
}
function deletePhoto(i,j){
 if(!confirm("この写真を削除しますか？"))return;
 draft.categories[current].items[i].photos.splice(j,1);
 saveDraft();renderCategory();
}

function setStatus(i,s){draft.categories[current].items[i].status=s;saveDraft();renderCategory()}
function setComment(v){draft.categories[current].comment=v;saveDraft()}
function nextCategory(){if(current<CATEGORIES.length-1){current++;renderCategory();scrollTo(0,0)}else showSummary()}
function prevCategory(){if(current>0){current--;renderCategory();scrollTo(0,0)}else{sections("properties");document.getElementById("footer").classList.add("hidden");title("物件を選択","巡回する物件を選んでください");renderProperties()}}
function showSummary(){sections("summary");title("巡回確認",draft.property.name);let h="";draft.categories.forEach(c=>{let x=c.items.filter(i=>i.status==="×").length,w=c.items.filter(i=>i.status==="△").length;let pc=c.items.reduce((n,i)=>n+((i.photos||[]).length),0);h+=`<div class="summary-line"><span><b>${c.name}</b></span><span>${x?`<span class="danger">× ${x}</span>`:""} ${w?`△ ${w}`:""} ${pc?`📷 ${pc}`:""}</span></div>`});summaryBody.innerHTML=h;overall.value=draft.overall||"";overall.oninput=()=>{draft.overall=overall.value;saveDraft()}}

function collectReportPhotos(){
 let out=[];
 draft.categories.forEach(c=>c.items.forEach(i=>(i.photos||[]).forEach(p=>out.push({
   category:c.name,item:i.name,status:i.status||"－",comment:p.comment||c.comment||"",data:p.data
 }))));
 return out;
}
function statusCounts(){
 let r={"○":0,"△":0,"×":0,"－":0,"未":0};
 draft.categories.forEach(c=>c.items.forEach(i=>{let k=i.status||"未";r[k]=(r[k]||0)+1}));
 return r;
}
function wrapCanvasText(ctx,text,maxWidth){
 let chars=Array.from(String(text||"")), lines=[],line="";
 for(const ch of chars){let test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}else line=test}
 if(line)lines.push(line); return lines;
}
function loadImg(src){return new Promise((resolve,reject)=>{let i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}
function drawCoverHeader(ctx,pageNo,total){
 ctx.fillStyle="#18365b";ctx.fillRect(0,0,1240,120);
 ctx.fillStyle="#fff";ctx.font="700 38px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";ctx.fillText("巡回点検報告書",70,74);
 ctx.font="500 20px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";ctx.textAlign="right";ctx.fillText(`${pageNo} / ${total}`,1170,72);ctx.textAlign="left";
}
async function buildReportCanvases(){
 draft.overall=document.getElementById("overall")?.value||draft.overall||"";saveDraft();
 const photos=collectReportPhotos(), photoPages=Math.ceil(photos.length/6), total=1+photoPages, pages=[];
 // page 1: report summary
 let c=document.createElement("canvas");c.width=1240;c.height=1754;let x=c.getContext("2d");
 x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);drawCoverHeader(x,1,total);
 x.fillStyle="#1d2939";x.font="700 34px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";x.fillText(draft.property.name,70,185);
 x.font="500 22px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";x.fillStyle="#667085";
 x.fillText(`巡回日：${draft.date}`,70,230);x.fillText(`住所：${draft.property.address||"未登録"}`,70,267);
 let sc=statusCounts();x.fillStyle="#f3f6f9";x.fillRect(70,305,1100,90);
 x.fillStyle="#1d2939";x.font="700 25px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";
 x.fillText(`○ 良好 ${sc["○"]}件`,105,360);x.fillText(`△ 経過観察 ${sc["△"]}件`,350,360);x.fillText(`× 要対応 ${sc["×"]}件`,650,360);x.fillText(`－ 対象外 ${sc["－"]}件`,910,360);
 let y=450;x.font="700 25px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";x.fillText("点検結果",70,y);y+=35;
 for(const cat of draft.categories){
   x.strokeStyle="#d8e0e8";x.beginPath();x.moveTo(70,y);x.lineTo(1170,y);x.stroke();y+=30;
   x.fillStyle="#18365b";x.font="700 22px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";x.fillText(cat.name,80,y);
   y+=30;x.font="500 19px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";x.fillStyle="#344054";
   for(const it of cat.items){
     let st=it.status||"未";x.fillStyle=st==="×"?"#a23b3b":st==="△"?"#a06a12":"#344054";
     x.fillText(`${st}  ${it.name}`,100,y);y+=27;
   }
   if(cat.comment){x.fillStyle="#667085";x.font="500 17px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";for(const ln of wrapCanvasText(x,"コメント："+cat.comment,980).slice(0,2)){x.fillText(ln,100,y);y+=23}}
   y+=16;if(y>1450)break;
 }
 x.fillStyle="#18365b";x.font="700 23px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";x.fillText("総合コメント",70,1580);
 x.fillStyle="#344054";x.font="500 19px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";
 let oy=1620;for(const ln of wrapCanvasText(x,draft.overall||"特記事項なし",1080).slice(0,4)){x.fillText(ln,80,oy);oy+=27}
 pages.push(c);
 // photo pages, 6 photos/page
 for(let pg=0;pg<photoPages;pg++){
   let pc=document.createElement("canvas");pc.width=1240;pc.height=1754;let ctx=pc.getContext("2d");
   ctx.fillStyle="#fff";ctx.fillRect(0,0,pc.width,pc.height);drawCoverHeader(ctx,pg+2,total);
   ctx.fillStyle="#1d2939";ctx.font="700 28px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";ctx.fillText("点検写真",70,175);
   let batch=photos.slice(pg*6,pg*6+6);
   for(let k=0;k<batch.length;k++){
     let col=k%2,row=Math.floor(k/2), bx=70+col*555, by=215+row*490, bw=515,bh=315;
     ctx.fillStyle="#f3f6f9";ctx.fillRect(bx,by,bw,bh);
     try{
       let img=await loadImg(batch[k].data),scale=Math.min(bw/img.width,bh/img.height),dw=img.width*scale,dh=img.height*scale;
       ctx.drawImage(img,bx+(bw-dw)/2,by+(bh-dh)/2,dw,dh);
     }catch(e){}
     ctx.fillStyle="#18365b";ctx.font="700 19px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";
     ctx.fillText(`${batch[k].status}  ${batch[k].category} / ${batch[k].item}`,bx,by+348);
     ctx.fillStyle="#475467";ctx.font="500 17px -apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif";
     let lines=wrapCanvasText(ctx,batch[k].comment||"コメントなし",bw);
     lines.slice(0,3).forEach((ln,z)=>ctx.fillText(ln,bx,by+378+z*22));
   }
   pages.push(pc);
 }
 return pages;
}
function dataUrlBytes(url){
 let b=atob(url.split(",")[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;
}
function makeImagePDF(canvases){
 let imgs=canvases.map(c=>dataUrlBytes(c.toDataURL("image/jpeg",0.84)));
 let parts=[],offsets=[0],len=0; const enc=new TextEncoder();
 function add(v){let u=typeof v==="string"?enc.encode(v):v;parts.push(u);len+=u.length}
 function obj(n,body){offsets[n]=len;add(`${n} 0 obj\n${body}\nendobj\n`)}
 add("%PDF-1.4\n");
 let n=canvases.length, catalog=1,pagesObj=2,next=3,pageNums=[],imgNums=[],contentNums=[];
 for(let i=0;i<n;i++){pageNums.push(next++);imgNums.push(next++);contentNums.push(next++)}
 obj(catalog,`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`);
 obj(pagesObj,`<< /Type /Pages /Kids [${pageNums.map(x=>x+" 0 R").join(" ")}] /Count ${n} >>`);
 for(let i=0;i<n;i++){
   obj(pageNums[i],`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${imgNums[i]} 0 R >> >> /Contents ${contentNums[i]} 0 R >>`);
   offsets[imgNums[i]]=len;add(`${imgNums[i]} 0 obj\n<< /Type /XObject /Subtype /Image /Width 1240 /Height 1754 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgs[i].length} >>\nstream\n`);add(imgs[i]);add("\nendstream\nendobj\n");
   let stream=`q\n595.28 0 0 841.89 0 0 cm\n/Im${i} Do\nQ\n`;
   obj(contentNums[i],`<< /Length ${enc.encode(stream).length} >>\nstream\n${stream}endstream`);
 }
 let xref=len;add(`xref\n0 ${next}\n0000000000 65535 f \n`);
 for(let i=1;i<next;i++)add(String(offsets[i]).padStart(10,"0")+" 00000 n \n");
 add(`trailer\n<< /Size ${next} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
 return new Blob(parts,{type:"application/pdf"});
}
function safeFileName(s){return String(s||"巡回点検").replace(/[\\/:*?"<>|]/g,"_")}
async function createPDFBlob(){
 let btn=document.getElementById("pdfShareBtn");if(btn){btn.disabled=true;btn.textContent="PDFを作成中…"}
 try{return makeImagePDF(await buildReportCanvases())}
 finally{if(btn){btn.disabled=false;btn.textContent="PDFを作成して会社へ送る"}}
}
async function createAndSharePDF(){
 if(!draft)return;
 try{
   let blob=await createPDFBlob(),name=`${draft.date.replace(/\//g,"-")}_${safeFileName(draft.property.name)}_巡回点検報告書.pdf`;
   let file=new File([blob],name,{type:"application/pdf"});
   if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
     await navigator.share({title:"巡回点検報告書",text:`${draft.property.name} ${draft.date} 巡回点検報告書`,files:[file]});
   }else{
     let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000);
     alert("PDFを保存しました。iPhoneの共有メニューからメール送信してください。");
   }
 }catch(e){if(e&&e.name!=="AbortError")alert("PDFの作成または共有に失敗しました。写真枚数を減らして再度お試しください。")}
}
async function previewPDF(){
 try{let blob=await createPDFBlob(),url=URL.createObjectURL(blob);window.open(url,"_blank");setTimeout(()=>URL.revokeObjectURL(url),120000)}
 catch(e){alert("PDFを作成できませんでした。")}
}

function discardCompleted(){if(!draft)return;if(!confirm("この巡回データと写真をiPhoneから削除しますか？\n会社への保存が済んでから実行してください。"))return;localStorage.removeItem("inspection_draft");draft=null;sections("home");title("巡回点検","iPhone 現場点検 V1.4");updateDraftInfo();}
function resumeDraft(){let d=JSON.parse(localStorage.getItem("inspection_draft")||"null");if(!d)return;draft=d;current=0;sections("inspection");renderCategory();}
function saveDraft(){try{localStorage.setItem("inspection_draft",JSON.stringify(draft));updateDraftInfo()}catch(e){alert("iPhone内の保存容量が不足しました。不要な写真を削除してください。")}}
function updateDraftInfo(){let d=JSON.parse(localStorage.getItem("inspection_draft")||"null");draftInfo.textContent=d?`${d.property.name} / ${d.date} の巡回データがあります`:"現在、作業中の巡回はありません";let b=document.getElementById("resumeBtn");if(b)b.style.display=d?"block":"none"}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
updateDraftInfo();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));}
</script>
